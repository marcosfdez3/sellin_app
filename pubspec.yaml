name: insider_track
description: Insider trading signals from SEC EDGAR
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  dio: ^5.4.0
  
  # State management
  flutter_riverpod: ^2.5.1
  
  # Navegación
  go_router: ^13.2.0
  
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  timeago: ^3.6.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.6
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
   - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sellin_logo.png"

flutter_native_splash:
  # La splash del sistema es solo fondo negro: el logo lo dibuja la app
  # (LaunchOverlay en main.dart) desde el SVG, porque Android 12+ escala y
  # emborrona el icono de su splash y además lo limita a un círculo de 192 dp.
  color: "#000000"
  android_12:
    color: "#000000"
    # Sin imagen, Android 12+ pondría el icono de la app: se usa uno transparente
    image: design/splash_blank.png
