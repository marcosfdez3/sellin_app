name: insider_track
description: Insider trading signals from SEC EDGAR
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  dio: ^5.4.0
  
  # State management
  flutter_riverpod: ^2.5.1
  
  # Navegación
  go_router: ^13.2.0
  
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  timeago: ^3.6.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
   - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sellin_logo.png" 

